<!DOCTYPE html>
<html lang="ko">
<head>
  {% include head.html %}
</head>
<body>
  {% include header.html %}
  {% include sidebar.html %}
  <main class="site-main">
    {{ content }}
    {% unless page.layout == 'post' %}
      {% include popular_posts.html %}
    {% endunless %}
  </main>
  {% include footer.html %}

  <script>
    // ----- 사이드바 드로어 토글 (모바일/태블릿) -----
    (function () {
      var ham = document.querySelector('[data-sidebar-toggle]');
      var sidebar = document.querySelector('[data-sidebar]');
      var backdrop = document.querySelector('[data-sidebar-backdrop]');
      var closeBtn = document.querySelector('[data-sidebar-close]');
      if (!ham || !sidebar || !backdrop) return;

      function setOpen(open) {
        sidebar.classList.toggle('is-open', open);
        backdrop.hidden = !open;
        backdrop.classList.toggle('is-visible', open);
        ham.setAttribute('aria-expanded', open ? 'true' : 'false');
        document.body.classList.toggle('is-sidebar-open', open);
      }
      ham.addEventListener('click', function () {
        setOpen(!sidebar.classList.contains('is-open'));
      });
      backdrop.addEventListener('click', function () { setOpen(false); });
      if (closeBtn) closeBtn.addEventListener('click', function () { setOpen(false); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false);
      });
    })();

    // ----- 푸터 누적 방문수 (GoatCounter JSON) -----
    (function () {
      var el = document.querySelector('[data-goat-counter]');
      if (!el) return;
      fetch('https://panddu.goatcounter.com/counter/TOTAL.json')
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (d) {
          var n = d.count_unique != null ? d.count_unique : (d.count || 0);
          el.textContent = Number(String(n).replace(/\D/g, '')).toLocaleString('ko-KR');
        })
        .catch(function () { /* silent — '—' 유지 */ });
    })();

    // ----- 사이드바 글 검색 (substring 매칭 + 점수 정렬, 드롭다운) -----
    (function () {
      var input = document.getElementById('sidebar-search');
      var results = document.getElementById('sidebar-search-results');
      if (!input || !results) return;

      var index = null;
      var loading = null;

      function loadIndex() {
        if (index) return Promise.resolve(index);
        if (loading) return loading;
        loading = fetch({{ '/search.json' | relative_url | jsonify }})
          .then(function (r) { return r.json(); })
          .then(function (data) { index = data; return data; });
        return loading;
      }

      function score(post, q) {
        var t = (post.title || '').toLowerCase();
        var c = (post.category || '').toLowerCase();
        var e = (post.excerpt || '').toLowerCase();
        if (t.indexOf(q) === 0) return 4;
        if (t.indexOf(q) >= 0) return 3;
        if (c.indexOf(q) >= 0) return 2;
        if (e.indexOf(q) >= 0) return 1;
        return 0;
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function render(hits) {
        if (!hits) { results.hidden = true; results.innerHTML = ''; return; }
        if (!hits.length) {
          results.innerHTML = '<div class="sidebar__search-empty">결과 없음</div>';
          results.hidden = false;
          return;
        }
        results.innerHTML = '<ul>' + hits.map(function (p) {
          var meta = escapeHtml(p.date) + (p.category ? ' · ' + escapeHtml(p.category) : '');
          return '<li><a href="' + escapeHtml(p.url) + '">' +
            '<span class="sidebar__search-title">' + escapeHtml(p.title) + '</span>' +
            '<span class="sidebar__search-meta">' + meta + '</span>' +
          '</a></li>';
        }).join('') + '</ul>';
        results.hidden = false;
      }

      var timer = null;
      input.addEventListener('input', function () {
        var q = input.value.trim().toLowerCase();
        clearTimeout(timer);
        timer = setTimeout(function () {
          if (!q) { render(null); return; }
          loadIndex().then(function (data) {
            var hits = data.map(function (p) { return { p: p, s: score(p, q) }; })
              .filter(function (h) { return h.s > 0; })
              .sort(function (a, b) { return b.s - a.s; })
              .slice(0, 8)
              .map(function (h) { return h.p; });
            render(hits);
          });
        }, 80);
      });

      input.addEventListener('focus', function () {
        if (input.value.trim() && index) input.dispatchEvent(new Event('input'));
      });

      document.addEventListener('click', function (e) {
        if (!e.target.closest('.sidebar__section--search')) {
          results.hidden = true;
        }
      });
    })();

    // ----- 다크모드 토글 (시스템 기본 + 명시 오버라이드 + giscus 동기화) -----
    (function () {
      var root = document.documentElement;
      var btn = document.querySelector('[data-theme-toggle]');
      var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

      function effective() {
        var t = root.getAttribute('data-theme');
        if (t === 'dark' || t === 'light') return t;
        return mq && mq.matches ? 'dark' : 'light';
      }

      // giscus iframe 테마를 현재 테마에 맞춤
      function syncGiscus() {
        var frame = document.querySelector('iframe.giscus-frame');
        if (!frame || !frame.contentWindow) return;
        frame.contentWindow.postMessage(
          { giscus: { setConfig: { theme: effective() } } },
          'https://giscus.app'
        );
      }

      if (btn) {
        btn.addEventListener('click', function () {
          var next = effective() === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
          syncGiscus();
        });
      }

      // 명시 선택이 없으면 시스템 변화 실시간 반영 (CSS는 자동, giscus만 nudge)
      if (mq) {
        var onChange = function () {
          var saved = null;
          try { saved = localStorage.getItem('theme'); } catch (e) {}
          if (saved !== 'dark' && saved !== 'light') syncGiscus();
        };
        if (mq.addEventListener) mq.addEventListener('change', onChange);
        else if (mq.addListener) mq.addListener(onChange);
      }

      // giscus가 로드 완료 메시지를 보낼 때 초기 테마 적용
      window.addEventListener('message', function (e) {
        if (e.origin !== 'https://giscus.app') return;
        if (e.data && e.data.giscus) syncGiscus();
      });
    })();

    // ----- 글 목록 더보기 (10개씩) -----
    (function () {
      var lists = document.querySelectorAll('[data-load-more]');
      lists.forEach(function (list) {
        var batch = parseInt(list.getAttribute('data-batch'), 10) || 10;
        var btn = list.nextElementSibling;
        if (!btn || !btn.hasAttribute('data-load-more-btn')) return;
        btn.addEventListener('click', function () {
          var hidden = list.querySelectorAll('.post-list__item--more');
          for (var i = 0; i < hidden.length && i < batch; i++) {
            hidden[i].classList.remove('post-list__item--more');
          }
          if (list.querySelectorAll('.post-list__item--more').length === 0) {
            btn.style.display = 'none';
          }
        });
      });
    })();

    // ----- 맨 위로 가기 (PC만) -----
    (function () {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'scroll-top';
      btn.setAttribute('aria-label', '맨 위로 가기');
      btn.innerHTML = '↑';
      document.body.appendChild(btn);

      btn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      var visible = false;
      function onScroll() {
        var show = window.scrollY > 200;
        if (show !== visible) {
          visible = show;
          btn.classList.toggle('is-visible', show);
        }
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();
  </script>
  <script defer src="{{ '/assets/js/qna.js' | relative_url }}"></script>
</body>
</html>
