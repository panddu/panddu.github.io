# 블로그 카테고리 메타.
# 포스트 frontmatter의 `category:` 값이 이 키와 매칭됨.
# 표시 순서는 이 파일 순서를 따라감.
# (파일명은 series.yml 그대로 유지 — 내부 코드 영향 최소화)
daily:
  display: 일상
  bracket: "[일상]"
  desc: 일상·육아·관심사·개발자 에피소드
  color: "#7c3aed"
  bg: "#ede9fe"

tech:
  display: 테크
  bracket: "[테크]"
  desc: AI·개발·기술 이야기
  color: "#2563eb"
  bg: "#dbeafe"

review:
  display: 리뷰
  bracket: "[리뷰]"
  desc: 제품·서비스·작품 리뷰
  color: "#059669"
  bg: "#d1fae5"

comms:
  display: 문답
  bracket: "[문답]"
  desc: 구독자 대상 Q&A 및 뚜쪽상담소 답변
  color: "#e11d48"
  bg: "#ffe4e6"

workroom:
  display: 작업실
  bracket: "[작업실]"
  desc: 직접 만든 도구·미니 프로젝트
  color: "#ea580c"
  bg: "#ffedd5"
