<!DOCTYPE html>
<html lang="ko">
<head>
  {% include head.html %}
</head>
<body>
  {% include header.html %}
  {% include sidebar.html %}
  <main class="site-main">
    {{ content }}
    {% if page.show_popular_posts %}
      {% include popular_posts.html %}
    {% endif %}
  </main>
  {% include footer.html %}

  <script>
    // ----- 사이드바 드로어 토글 (모바일/태블릿) -----
    (function () {
      var ham = document.querySelector('[data-sidebar-toggle]');
      var sidebar = document.querySelector('[data-sidebar]');
      var backdrop = document.querySelector('[data-sidebar-backdrop]');
      var closeBtn = document.querySelector('[data-sidebar-close]');
      if (!ham || !sidebar || !backdrop) return;

      function setOpen(open) {
        sidebar.classList.toggle('is-open', open);
        backdrop.hidden = !open;
        backdrop.classList.toggle('is-visible', open);
        ham.setAttribute('aria-expanded', open ? 'true' : 'false');
        document.body.classList.toggle('is-sidebar-open', open);
      }
      ham.addEventListener('click', function () {
        setOpen(!sidebar.classList.contains('is-open'));
      });
      backdrop.addEventListener('click', function () { setOpen(false); });
      if (closeBtn) closeBtn.addEventListener('click', function () { setOpen(false); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false);
      });
    })();

    // ----- 푸터 누적 방문수 (GoatCounter JSON) -----
    (function () {
      var el = document.querySelector('[data-goat-counter]');
      if (!el) return;
      fetch('https://panddu.goatcounter.com/counter/TOTAL.json')
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (d) {
          var n = d.count_unique != null ? d.count_unique : (d.count || 0);
          el.textContent = Number(String(n).replace(/\D/g, '')).toLocaleString('ko-KR');
        })
        .catch(function () { /* silent — '—' 유지 */ });
    })();

    // ----- 사이드바 글 검색 (substring 매칭 + 점수 정렬, 드롭다운) -----
    (function () {
      var input = document.getElementById('sidebar-search');
      var results = document.getElementById('sidebar-search-results');
      if (!input || !results) return;

      var index = null;
      var loading = null;

      function loadIndex() {
        if (index) return Promise.resolve(index);
        if (loading) return loading;
        loading = fetch({{ '/search.json' | relative_url | jsonify }})
          .then(function (r) { return r.json(); })
          .then(function (data) { index = data; return data; });
        return loading;
      }

      function score(post, q) {
        var t = (post.title || '').toLowerCase();
        var c = (post.category || '').toLowerCase();
        var e = (post.excerpt || '').toLowerCase();
        if (t.indexOf(q) === 0) return 4;
        if (t.indexOf(q) >= 0) return 3;
        if (c.indexOf(q) >= 0) return 2;
        if (e.indexOf(q) >= 0) return 1;
        return 0;
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function render(hits) {
        if (!hits) { results.hidden = true; results.innerHTML = ''; return; }
        if (!hits.length) {
          results.innerHTML = '<div class="sidebar__search-empty">결과 없음</div>';
          results.hidden = false;
          return;
        }
        results.innerHTML = '<ul>' + hits.map(function (p) {
          var meta = escapeHtml(p.date) + (p.category ? ' · ' + escapeHtml(p.category) : '');
          return '<li><a href="' + escapeHtml(p.url) + '">' +
            '<span class="sidebar__search-title">' + escapeHtml(p.title) + '</span>' +
            '<span class="sidebar__search-meta">' + meta + '</span>' +
          '</a></li>';
        }).join('') + '</ul>';
        results.hidden = false;
      }

      var timer = null;
      input.addEventListener('input', function () {
        var q = input.value.trim().toLowerCase();
        clearTimeout(timer);
        timer = setTimeout(function () {
          if (!q) { render(null); return; }
          loadIndex().then(function (data) {
            var hits = data.map(function (p) { return { p: p, s: score(p, q) }; })
              .filter(function (h) { return h.s > 0; })
              .sort(function (a, b) { return b.s - a.s; })
              .slice(0, 8)
              .map(function (h) { return h.p; });
            render(hits);
          });
        }, 80);
      });

      input.addEventListener('focus', function () {
        if (input.value.trim() && index) input.dispatchEvent(new Event('input'));
      });

      document.addEventListener('click', function (e) {
        if (!e.target.closest('.sidebar__section--search')) {
          results.hidden = true;
        }
      });
    })();

    // ----- 다크모드 토글 (시스템 기본 + 명시 오버라이드 + giscus 동기화) -----
    (function () {
      var root = document.documentElement;
      var btn = document.querySelector('[data-theme-toggle]');
      var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

      function effective() {
        var t = root.getAttribute('data-theme');
        if (t === 'dark' || t === 'light') return t;
        return mq && mq.matches ? 'dark' : 'light';
      }

      // giscus iframe 테마를 현재 테마에 맞춤
      function syncGiscus() {
        var frame = document.querySelector('iframe.giscus-frame');
        if (!frame || !frame.contentWindow) return;
        frame.contentWindow.postMessage(
          { giscus: { setConfig: { theme: effective() } } },
          'https://giscus.app'
        );
      }

      if (btn) {
        btn.addEventListener('click', function () {
          var next = effective() === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
          syncGiscus();
        });
      }

      // 명시 선택이 없으면 시스템 변화 실시간 반영 (CSS는 자동, giscus만 nudge)
      if (mq) {
        var onChange = function () {
          var saved = null;
          try { saved = localStorage.getItem('theme'); } catch (e) {}
          if (saved !== 'dark' && saved !== 'light') syncGiscus();
        };
        if (mq.addEventListener) mq.addEventListener('change', onChange);
        else if (mq.addListener) mq.addListener(onChange);
      }

      // giscus가 로드 완료 메시지를 보낼 때 초기 테마 적용
      window.addEventListener('message', function (e) {
        if (e.origin !== 'https://giscus.app') return;
        if (e.data && e.data.giscus) syncGiscus();
      });
    })();

    // ----- 글 목록 더보기 (10개씩) -----
    (function () {
      var lists = document.querySelectorAll('[data-load-more]');
      lists.forEach(function (list) {
        var batch = parseInt(list.getAttribute('data-batch'), 10) || 10;
        var btn = list.nextElementSibling;
        if (!btn || !btn.hasAttribute('data-load-more-btn')) return;
        btn.addEventListener('click', function () {
          var hidden = list.querySelectorAll('.post-list__item--more');
          for (var i = 0; i < hidden.length && i < batch; i++) {
            hidden[i].classList.remove('post-list__item--more');
          }
          if (list.querySelectorAll('.post-list__item--more').length === 0) {
            btn.style.display = 'none';
          }
        });
      });
    })();

    // ----- 맨 위로 가기 (PC만) -----
    (function () {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'scroll-top';
      btn.setAttribute('aria-label', '맨 위로 가기');
      btn.innerHTML = '↑';
      document.body.appendChild(btn);

      btn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      var visible = false;
      function onScroll() {
        var show = window.scrollY > 200;
        if (show !== visible) {
          visible = show;
          btn.classList.toggle('is-visible', show);
        }
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();

    // ----- 이미지 라이트박스 줌 (본문 이미지 클릭 시 확대) -----
    (function () {
      var postContent = document.querySelector('.post-content');
      if (!postContent) return;

      var images = postContent.querySelectorAll('img');
      if (!images.length) return;

      // 라이트박스 DOM 생성
      var lightbox = document.createElement('div');
      lightbox.className = 'img-lightbox';
      lightbox.setAttribute('role', 'dialog');
      lightbox.setAttribute('aria-modal', 'true');
      lightbox.setAttribute('aria-label', '이미지 크게 보기');

      var closeBtn = document.createElement('button');
      closeBtn.className = 'img-lightbox__close';
      closeBtn.setAttribute('type', 'button');
      closeBtn.setAttribute('aria-label', '닫기');
      closeBtn.innerHTML = '&times;';

      var bigImg = document.createElement('img');
      bigImg.className = 'img-lightbox__img';

      lightbox.appendChild(closeBtn);
      lightbox.appendChild(bigImg);
      document.body.appendChild(lightbox);

      var scale = 1;
      var posX = 0;
      var posY = 0;
      var startDist = 0;
      var startScale = 1;
      var startX = 0;
      var startY = 0;
      var isDragging = false;
      var lastTap = 0;

      function updateTransform(animate) {
        if (animate) {
          bigImg.style.transition = 'transform 0.2s cubic-bezier(0.16, 1, 0.3, 1)';
        } else {
          bigImg.style.transition = 'none';
        }
        bigImg.style.transform = 'translate(' + posX + 'px, ' + posY + 'px) scale(' + scale + ')';
      }

      function resetTransform() {
        scale = 1;
        posX = 0;
        posY = 0;
        updateTransform(true);
      }

      function openLightbox(src, alt) {
        bigImg.src = src;
        bigImg.alt = alt || '';
        resetTransform();
        lightbox.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('is-open');
        document.body.style.overflow = '';
        setTimeout(resetTransform, 250);
      }

      images.forEach(function (img) {
        img.addEventListener('click', function () {
          openLightbox(this.currentSrc || this.src, this.alt);
        });
      });

      // 닫기 버튼 및 배경 클릭
      closeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        closeLightbox();
      });

      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) {
          closeLightbox();
        }
      });

      // ESC 키로 닫기
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && lightbox.classList.contains('is-open')) {
          closeLightbox();
        }
      });

      // ----- 터치 제스처 (핀치 줌, 드래그 이동, 더블 탭 확대) -----
      function getDistance(t1, t2) {
        var dx = t1.clientX - t2.clientX;
        var dy = t1.clientY - t2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      bigImg.addEventListener('touchstart', function (e) {
        if (!lightbox.classList.contains('is-open')) return;

        if (e.touches.length === 2) {
          // 핀치 줌 시작
          startDist = getDistance(e.touches[0], e.touches[1]);
          startScale = scale;
        } else if (e.touches.length === 1) {
          // 싱글 터치 (이동 또는 더블탭 감지)
          var now = Date.now();
          if (now - lastTap < 300) {
            // 더블 탭: 1배 <-> 2.5배 토글
            if (scale > 1.2) {
              resetTransform();
            } else {
              scale = 2.5;
              posX = 0;
              posY = 0;
              updateTransform(true);
            }
            lastTap = 0;
            return;
          }
          lastTap = now;

          isDragging = true;
          startX = e.touches[0].clientX - posX;
          startY = e.touches[0].clientY - posY;
        }
      }, { passive: true });

      bigImg.addEventListener('touchmove', function (e) {
        if (!lightbox.classList.contains('is-open')) return;

        if (e.touches.length === 2 && startDist > 0) {
          e.preventDefault();
          var currentDist = getDistance(e.touches[0], e.touches[1]);
          // 핀치 감도 완화: 변화율을 55% 수준으로 댐핑하여 부드럽고 묵직하게 확대
          var ratio = currentDist / startDist;
          var dampedRatio = 1 + (ratio - 1) * 0.55;
          var newScale = startScale * dampedRatio;
          // 최소 1배 ~ 최대 3.5배 제한
          scale = Math.min(Math.max(newScale, 0.95), 3.5);
          updateTransform(false);
        } else if (e.touches.length === 1 && isDragging && scale > 1.05) {
          e.preventDefault();
          posX = e.touches[0].clientX - startX;
          posY = e.touches[0].clientY - startY;
          updateTransform(false);
        }
      }, { passive: false });

      bigImg.addEventListener('touchend', function (e) {
        if (e.touches.length < 2) {
          startDist = 0;
        }
        if (e.touches.length === 0) {
          isDragging = false;
          if (scale < 1.05) {
            resetTransform();
          }
        }
      }, { passive: true });

      // PC 마우스 휠 줌: 스텝을 0.08로 대폭 완화하여 부드럽게 확대
      bigImg.addEventListener('wheel', function (e) {
        e.preventDefault();
        var delta = e.deltaY > 0 ? -0.08 : 0.08;
        scale = Math.min(Math.max(scale + delta, 1), 3.5);
        if (scale === 1) {
          posX = 0;
          posY = 0;
        }
        updateTransform(true);
      }, { passive: false });

      bigImg.addEventListener('mousedown', function (e) {
        if (scale <= 1) return;
        isDragging = true;
        startX = e.clientX - posX;
        startY = e.clientY - posY;
      });

      window.addEventListener('mousemove', function (e) {
        if (!isDragging || scale <= 1) return;
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        updateTransform(false);
      });

      window.addEventListener('mouseup', function () {
        isDragging = false;
      });
    })();
  </script>
  <script defer src="{{ '/assets/js/qna.js' | relative_url }}"></script>
</body>
</html>
