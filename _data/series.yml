# 채널 시리즈 메타.
# 포스트 frontmatter의 `category:` 값이 이 키와 매칭됨.
# color는 시리즈 배지에 적용되는 accent — 하나의 톤 안에서 5색 분기.
ddu:
  display: 뚜데
  bracket: "[뚜데]"
  desc: 메인 토크. 회사·AI·개발자 진로·직장 생활.
  color: "#5b6cff"
  bg: "#eef1ff"

keyboard:
  display: 개색key
  bracket: "[개색key]"
  desc: 키보드 리뷰.
  color: "#0ea5e9"
  bg: "#e0f2fe"

gear:
  display: 뚜gear
  bracket: "[뚜gear]"
  desc: 키보드 외 장비 리뷰·테무깡·알리깡.
  color: "#10b981"
  bg: "#d1fae5"

vlog:
  display: vlog
  bracket: "[vlog]"
  desc: 일상 기록. 뚜기 재우고 책상 앞, 동네, 출퇴근.
  color: "#f43f5e"
  bg: "#ffe4e6"

qna:
  display: 뚜쪽 상담소
  bracket: "[뚜쪽 상담소]"
  desc: 시청자 질문 묶음 정리.
  color: "#d97706"
  bg: "#fef3c7"
