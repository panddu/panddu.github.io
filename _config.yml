title: 판뚜 | panddu
tagline: 안녕하세요. 판교 뚜벅쵸입니다.
description: >-
  YouTube 판교 뚜벅쵸 | 판뚜 | panddu
author: 판뚜
url: "https://panddu.github.io"
baseurl: ""

# 카톡·페북 등 공유 시 미리보기 이미지 (각 글 frontmatter의 image:로 덮어쓸 수 있음)
image: /assets/img/avatar.png

# Page-level defaults — jekyll-seo-tag가 site.image를 og:image로 안 잡는 이슈 우회용
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/avatar.png

# Google Analytics 4 — production 빌드에만 출력
google_analytics: G-BBPMF5TZ6B

permalink: /posts/:year/:month/:slug/

# Site nav
nav:
  - { name: 글, url: "/" }
  - { name: 카테고리, url: "/series/" }
  - { name: 뚜벅뚜벅, url: "/board/" }
  - { name: 소개, url: "/about/" }

# Series 메타데이터 — 시리즈 페이지·포스트 헤더에서 참조
# 자세한 값은 _data/series.yml

# Giscus 댓글 — GitHub Discussions 기반.
giscus:
  repo: "panddu/panddu.github.io"
  repo_id: "R_kgDOSsPSNg"
  category: "Announcements"
  category_id: "DIC_kwDOSsPSNs4C-J2r"
  mapping: "pathname"
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: "bottom"
  theme: "light"
  lang: "ko"

# 뚜벅뚜벅 채팅 — 공개 수다방(Discord) + 1:1 비밀방(카카오 오픈채팅)
# discord_*는 WidgetBot(e.widgetbot.io) 임베드용. 서버에 WidgetBot 봇 초대 후 ID 입력하면 섹션이 켜짐.
board_chat:
  discord_server_id: "1512428013629997148"   # WidgetBot 서버 ID — 채워지면 수다방 섹션 노출
  discord_channel_id: "1512428015814967328"  # '오픈톡' 채널 — 기본으로 열림
  discord_invite_url: "https://discord.gg/aNGPV3bM"  # 디스코드 서버 초대 링크 — '들어가기' 버튼 노출
  kakao_openchat_url: "https://open.kakao.com/me/panddu"

# GitHub Pages 빌드 환경과 동일하게 유지
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: true
  syntax_highlighter: rouge

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  - .bundle/
