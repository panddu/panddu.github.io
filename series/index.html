---
layout: default
title: 카테고리
permalink: /series/
description: 판뚜 블로그의 글 분류 — 노트와 소통 아카이브.
---

<div class="series-index">
  {% for s in site.data.series %}
    {% assign key = s[0] %}
    {% assign meta = s[1] %}
    <a class="series-card" href="{{ '/series/' | append: key | append: '/' | relative_url }}">
      <div class="series-card__bracket">{{ meta.bracket }}</div>
      <div class="series-card__title">{{ meta.display }}</div>
      <p class="series-card__desc">{{ meta.desc }}</p>
    </a>
  {% endfor %}
</div>
