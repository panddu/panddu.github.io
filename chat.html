---
layout: default
title: 오픈톡
permalink: /chat/
description: 판교뚜벅쵸·판뚜의 오픈톡. 누구나 들어와 실시간으로 떠드는 공개 채팅방.
---

<section class="board-hero">
  <h1 class="board-hero__title">오픈톡</h1>
  <p class="board-hero__desc">디스코드 공개 채팅방</p>
</section>

{%- if site.board_chat.discord_server_id != "" -%}
<section class="board-chat board-chat--first">
  <div class="board-chat__discord">
    <widgetbot
      server="{{ site.board_chat.discord_server_id }}"
      {%- if site.board_chat.discord_channel_id != "" %}
      channel="{{ site.board_chat.discord_channel_id }}"
      {%- endif %}
      width="100%"
      height="600"></widgetbot>
    <script src="https://cdn.jsdelivr.net/npm/@widgetbot/html-embed" async></script>
  </div>
</section>
{%- endif -%}
