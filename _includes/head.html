<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 다크모드: 페인트 전에 저장된 선택을 적용해 깜빡임(FOUC) 방지. 선택 없으면 prefers-color-scheme 따라감. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<title>{% if page.title %}{{ page.title | escape }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

<link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

{% feed_meta %}
{% seo title=false %}

<!-- Naver Search Advisor 소유 확인 -->
<meta name="naver-site-verification" content="d5f92c264a1123bf9273532fb68350e554437383" />

{% if jekyll.environment == "production" and site.google_analytics %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}

{% if jekyll.environment == "production" %}
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4098225824538946"
     crossorigin="anonymous"></script>

<!-- GoatCounter (공개 카운터·세션 ~8h 단위, 쿠키 X) -->
<script data-goatcounter="https://panddu.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
{% endif %}

<!-- Mermaid.js 다이어그램 렌더링 지원 -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  document.addEventListener("DOMContentLoaded", function() {
    // 1. 마크다운의 mermaid 코드블록을 div.mermaid 로 변환
    document.querySelectorAll("pre code.language-mermaid").forEach(function(code) {
      const pre = code.parentNode;
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      pre.parentNode.replaceChild(div, pre);
    });

    // 2. 머메이드 기본 스타일 초기화 (세부 스타일링은 CSS에서 !important로 제어)
    mermaid.initialize({ 
      startOnLoad: true, 
      theme: 'neutral',
      flowchart: {
        htmlLabels: true,
        useMaxWidth: true
      }
    });
  });
</script>
