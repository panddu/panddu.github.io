name: Update popular posts

on:
  schedule:
    - cron: "0 15 * * *"  # KST 자정(00:00) = UTC 15:00, 하루 1회
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: popular-posts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch popular posts from GA4
        env:
          GA4_CLIENT_ID: ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET: ${{ secrets.GA4_CLIENT_SECRET }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
        run: python3 scripts/fetch_popular_posts.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/popular_posts.json
          git diff --cached --quiet || git commit -m "chore: update popular posts"
          git push
