# 블로그 카테고리 메타.
# 포스트 frontmatter의 `category:` 값이 이 키와 매칭됨.
# color는 시리즈 배지에 적용되는 accent.
#
# 영상 시리즈와 블로그 카테고리는 분리: 블로그는 3개로 단순화.
qna:
  display: 뚜쪽상담소
  bracket: "[뚜쪽상담소]"
  desc: 시청자 질문 묶음 정리. mingus-agent panddu.qna로 자동 생성된 모음 포함.
  color: "#d97706"
  bg: "#fef3c7"

qa:
  display: Q&A
  bracket: "[Q&A]"
  desc: 한 질문에 대한 단발 응답형 글.
  color: "#5b6cff"
  bg: "#eef1ff"

etc:
  display: 그냥 글
  bracket: "[그냥 글]"
  desc: 시리즈 안 묶이는 자유 글.
  color: "#6b7280"
  bg: "#f3f4f6"
