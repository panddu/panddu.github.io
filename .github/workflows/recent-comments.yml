name: Update recent comments

on:
  discussion_comment:
    types: [created]
  schedule:
    - cron: "0 3 * * *"  # 백업용 — 이벤트가 누락되는 경우 대비
  workflow_dispatch: {}

permissions:
  contents: write
  discussions: read

concurrency:
  group: recent-comments
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch recent comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_recent_comments.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/recent_comments.json
          git diff --cached --quiet || git commit -m "chore: update recent comments"
          git push
