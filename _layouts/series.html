---
layout: default
---
{%- assign s = site.data.series[page.series_key] -%}
<section class="series-hero">
  <h1 class="series-hero__title">{{ s.display }}</h1>
  <p class="series-hero__desc muted">{{ s.desc }}</p>
</section>

<section class="post-list">
  {% assign series_posts = site.posts | where: "category", page.series_key %}
  {% include post_list.html posts=series_posts %}
</section>
