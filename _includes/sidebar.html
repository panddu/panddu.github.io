<aside class="sidebar" data-sidebar aria-label="사이드바">
  <button class="sidebar__close" data-sidebar-close type="button" aria-label="사이드바 닫기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  </button>

  <div class="sidebar__inner">
    <div class="sidebar__section sidebar__section--search">
      <div class="sidebar__search">
        <svg class="sidebar__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="sidebar-search" type="search" placeholder="글 검색…" autocomplete="off" aria-label="글 검색">
      </div>
      <div class="sidebar__search-results" id="sidebar-search-results" hidden></div>
    </div>

    <nav class="sidebar__section" aria-label="카테고리">
      <h2 class="sidebar__heading"><span>카테고리</span><a class="sidebar__heading-total" href="{{ '/posts/' | relative_url }}">전체 {{ site.posts | size }}</a></h2>
      <ul class="sidebar__list">
        {% for s in site.data.series %}
          {%- assign key = s[0] -%}
          {%- assign meta = s[1] -%}
          {%- assign count = site.posts | where: "category", key | size -%}
          <li>
            <a class="sidebar__series-link{% if page.series_key == key %} is-current{% endif %}"
               href="{{ '/series/' | append: key | append: '/' | relative_url }}">
              <span class="sidebar__series-chip" style="color: {{ meta.color }}; background: {{ meta.bg }};">{{ meta.display }}</span>
              <span class="sidebar__series-count">{{ count }}</span>
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>

    <nav class="sidebar__section" aria-label="공간">
      <a class="sidebar__cta{% if page.url == '/board/' %} is-current{% endif %}" href="{{ '/board/' | relative_url }}">
        <span class="sidebar__cta-emoji" aria-hidden="true">💬</span>
        <span class="sidebar__cta-label">뚜벅뚜벅</span>
        <span class="sidebar__cta-sub">한마디 남기고 가요</span>
      </a>
      <a class="sidebar__cta{% if page.url == '/chat/' %} is-current{% endif %}" href="{{ '/chat/' | relative_url }}">
        <span class="sidebar__cta-emoji" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3a13.7 13.7 0 0 0-.69 1.41 18.27 18.27 0 0 0-5.487 0A12.6 12.6 0 0 0 9.69 3 19.74 19.74 0 0 0 5.93 4.37C2.36 9.68 1.4 14.86 1.88 19.96a19.93 19.93 0 0 0 6.06 3.06c.49-.67.92-1.38 1.29-2.13-.71-.27-1.39-.6-2.03-.99.17-.13.34-.26.5-.4a14.23 14.23 0 0 0 12.2 0c.16.14.33.27.5.4-.64.39-1.32.72-2.03.99.37.75.8 1.46 1.29 2.13a19.9 19.9 0 0 0 6.06-3.06c.57-5.91-.98-11.04-4.1-15.59zM8.52 16.33c-1.18 0-2.16-1.08-2.16-2.42s.95-2.42 2.16-2.42c1.21 0 2.18 1.09 2.16 2.42 0 1.34-.95 2.42-2.16 2.42zm6.96 0c-1.18 0-2.16-1.08-2.16-2.42s.95-2.42 2.16-2.42c1.21 0 2.18 1.09 2.16 2.42 0 1.34-.95 2.42-2.16 2.42z"/></svg>
        </span>
        <span class="sidebar__cta-label">오픈톡</span>
        <span class="sidebar__cta-sub">다같이 실시간 채팅</span>
      </a>
      <a class="sidebar__cta" href="https://forms.gle/cAQTXZizeeerfzon6" target="_blank" rel="noopener">
        <span class="sidebar__cta-emoji" aria-hidden="true">📮</span>
        <span class="sidebar__cta-label">뚜쪽상담소</span>
        <span class="sidebar__cta-sub">고민·질문 제보하기</span>
      </a>
    </nav>
  </div>
</aside>
<div class="sidebar-backdrop" data-sidebar-backdrop hidden></div>
