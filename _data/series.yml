# 블로그 카테고리 메타.
# 포스트 frontmatter의 `category:` 값이 이 키와 매칭됨.
# 표시 순서는 이 파일 순서를 따라감.
etc:
  display: 노트
  bracket: "[노트]"
  desc: 시리즈 안 묶이는 자유 글·메모·여담
  color: "#6b7280"
  bg: "#f3f4f6"

qa:
  display: Q&A
  bracket: "[Q&A]"
  desc: 묻고 답하기
  color: "#5b6cff"
  bg: "#eef1ff"

qna:
  display: 뚜쪽상담소
  bracket: "[뚜쪽상담소]"
  desc: 뚜쪽상담소 시리즈 답변 정리
  color: "#d97706"
  bg: "#fef3c7"

